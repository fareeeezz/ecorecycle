<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>Request Pickup</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>

<body class="app-body">

<video autoplay muted loop playsinline id="bgVideo">
  <source src="eco-bg.mp4" type="video/mp4">
</video>

<header class="eco-header">
  <div class="container d-flex justify-content-between align-items-center py-2">
    <div class="eco-title">EcoRecycle</div>
    <a href="#" onclick="logout()" class="eco-nav-link">Logout</a>
  </div>
</header>

<main class="container py-4">
  <h2 class="text-center mb-3">Request Pickup</h2>

  <form id="requestForm">
    <select class="form-select mb-2 material-item">
      <option value="">Pilih Barang</option>
      <option>Plastik</option>
      <option>Kertas</option>
      <option>Tin</option>
    </select>

    <input type="number" step="0.1" class="form-control mb-3 weight-item" placeholder="Berat (kg)">

    <label class="form-label">Lokasi Pickup</label>
    <div id="map"></div>

    <input type="hidden" id="locationLat">
    <input type="hidden" id="locationLng">

    <button class="btn btn-eco-primary w-100 mt-3">Hantar</button>
  </form>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
