<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>EcoRecycle – Request</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>

<body class="app-body">

<video autoplay muted loop playsinline id="bgVideo">
  <source src="eco-bg.mp4" type="video/mp4">
</video>

<header class="eco-header">
  <div class="container d-flex justify-content-between align-items-center py-2">
    <div class="eco-title">EcoRecycle</div>
    <a href="#" onclick="handleLogout()" class="eco-nav-link">Logout</a>
  </div>
</header>

<main class="container py-5">
  <h2 class="text-center mb-4">Request Pickup</h2>

  <form id="requestForm">

    <select class="form-select mb-3 material-item">
      <option value="">Pilih Barang</option>
      <option>Plastik</option>
      <option>Kertas</option>
      <option>Tin</option>
    </select>

    <input type="number" step="0.1" class="form-control mb-3 weight-item" placeholder="Berat (kg)">

    <div id="map"></div>

    <input id="locationDisplay" class="form-control mt-2" readonly>
    <input id="locationLat" type="hidden">
    <input id="locationLng" type="hidden">

    <button class="btn btn-eco-primary w-100 mt-3">
      Hantar & Kira
    </button>
  </form>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
