<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>EcoRecycle – Request Pickup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>

<body class="app-body">

<video autoplay muted loop playsinline id="bgVideo">
  <source src="eco-bg.mp4" type="video/mp4">
</video>

<main class="container py-5">
  <h1 class="request-title text-center mb-3">Request Pickup</h1>

  <form id="requestForm" class="card p-4 shadow">

    <div class="multi-item-row mb-3">
      <select class="form-select material-item">
        <option value="">Pilih Barang</option>
        <option>Plastik</option>
        <option>Kertas</option>
        <option>Tin</option>
        <option>Kaca</option>
      </select>

      <input type="number" class="form-control weight-item mt-2" placeholder="Berat (kg)">
    </div>

    <div id="map" class="mb-3"></div>

    <input id="locationDisplay" class="form-control mb-3" readonly>

    <input type="hidden" id="locationLat">
    <input type="hidden" id="locationLng">

    <button class="btn btn-eco-primary w-100">Hantar & Kira Insentif</button>
  </form>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
