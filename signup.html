<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>EcoRecycle – Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="app-body">
<video autoplay muted loop playsinline id="bgVideo">
  <source src="eco-bg.mp4" type="video/mp4">
</video>

<main class="auth-main">
  <div class="auth-card">
    <h2 class="auth-title">Daftar Akaun</h2>

    <form id="signupForm">
      <input class="form-control mb-2" id="signupUsername" placeholder="Username" required>
      <input class="form-control mb-2" id="signupPhone" placeholder="No Telefon" required>
      <input type="password" class="form-control mb-3" id="signupPassword" placeholder="Kata Laluan" required>
      <button class="btn btn-eco-primary w-100">Daftar</button>
    </form>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
