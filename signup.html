<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>EcoRecycle – Sign Up</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="app-body">

<video autoplay muted loop playsinline id="bgVideo">
  <source src="eco-bg.mp4" type="video/mp4">
</video>

<main class="auth-main">
  <div class="auth-card">

    <h1 class="auth-title">Daftar Akaun</h1>

    <form id="signupForm">
      <label class="form-label">Username</label>
      <input id="signupUsername" class="form-control mb-3" required>

      <label class="form-label">Nombor Telefon</label>
      <input id="signupPhone" class="form-control mb-3" required>

      <label class="form-label">Kata Laluan</label>
      <input id="signupPassword" type="password" class="form-control mb-4" required>

      <button class="btn btn-eco-primary w-100">Daftar</button>
    </form>

  </div>
</main>

<script src="app.js"></script>
</body>
</html>
