<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>EcoRecycle – Signup</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="app-body">

<video autoplay muted loop playsinline id="bgVideo">
  <source src="eco-bg.mp4" type="video/mp4">
</video>

<main class="auth-main">
  <div class="auth-card">
    <h1 class="auth-title">Daftar Akaun</h1>

    <form id="signupForm">
      <input id="signupUsername" class="form-control mb-3" placeholder="Username" required>
      <input id="signupPhone" class="form-control mb-3" placeholder="Telefon" required>
      <input id="signupPassword" type="password" class="form-control mb-3" placeholder="Password" required>

      <button class="btn btn-eco-primary w-100">Daftar</button>
    </form>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
