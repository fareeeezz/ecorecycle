<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>EcoRecycle – Rider Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="app-body">

<!-- VIDEO BACKGROUND -->
<video autoplay muted loop playsinline id="bgVideo">
  <source src="eco-bg.mp4" type="video/mp4">
</video>

<!-- HEADER -->
<header class="eco-header">
  <div class="container d-flex justify-content-between align-items-center py-2">
    <div class="d-flex align-items-center gap-2">
      <div class="eco-logo-circle">♻️</div>
      <div>
        <div class="eco-title">EcoRecycle</div>
        <div class="eco-subtitle">Rider Portal</div>
      </div>
    </div>

    <!-- LOGOUT RIDER -->
    <a href="#" class="eco-nav-link" id="riderLogoutBtn">Logout</a>
  </div>
</header>

<!-- MAIN -->
<main class="container py-5">
  <h2 class="text-center mb-4">Rider Dashboard</h2>

  <div id="riderOrders"></div>
</main>

<script src="rider.js"></script>
</body>
</html>
