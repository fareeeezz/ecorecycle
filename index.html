<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>EcoRecycle – Log Masuk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="app-body">

<video autoplay muted loop playsinline id="bgVideo">
  <source src="eco-bg.mp4" type="video/mp4">
</video>

<header class="eco-header">
  <div class="container d-flex justify-content-between align-items-center py-2">
    <div class="d-flex align-items-center gap-2">
      <div class="eco-logo-circle">♻️</div>
      <div>
        <div class="eco-title">EcoRecycle</div>
        <div class="eco-subtitle">Pickup Kitar Semula Komuniti</div>
      </div>
    </div>
    <nav class="eco-nav">
      <a href="signup.html" class="eco-nav-link">Sign Up</a>
    </nav>
  </div>
</header>

<main class="auth-main">
  <div class="auth-card">

    <h1 class="auth-title">Log Masuk</h1>
    <p class="auth-subtitle">Masuk untuk buat request pickup.</p>

    <form id="loginForm">
      <label class="form-label">Username</label>
      <input id="username" class="form-control mb-3" required>

      <label class="form-label">Nombor Telefon</label>
      <input id="phone" class="form-control mb-3" required>

      <label class="form-label">Kata Laluan</label>
      <input id="password" type="password" class="form-control mb-4" required>

      <button class="btn btn-eco-primary w-100">Log Masuk</button>
    </form>

  </div>
</main>

<script src="app.js"></script>
</body>
</html>
