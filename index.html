<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>EcoRecycle – Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="app-body">

<video autoplay muted loop playsinline id="bgVideo">
  <source src="eco-bg.mp4" type="video/mp4">
</video>

<header class="eco-header">
  <div class="container d-flex align-items-center gap-2 py-2">
    <div class="eco-logo-circle">♻️</div>
    <div>
      <div class="eco-title">EcoRecycle</div>
      <div class="eco-subtitle">Pickup Kitar Semula Komuniti</div>
    </div>
  </div>
</header>

<main class="auth-main">
  <div class="auth-card">

    <div class="btn-group w-100 mb-3">
      <button class="btn btn-outline-success active" id="loginCustomerBtn">Customer</button>
      <button class="btn btn-outline-success" id="loginRiderBtn">Rider</button>
    </div>

    <h1 class="auth-title">Log Masuk</h1>
    <p class="auth-subtitle">Pilih peranan dan log masuk</p>

    <form id="loginForm">
      <input type="hidden" id="loginRole" value="customer">

      <div class="mb-3">
        <label class="form-label">Username</label>
        <input id="username" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Telefon</label>
        <input id="phone" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Kata Laluan</label>
        <input id="password" type="password" class="form-control" required>
      </div>

      <button class="btn btn-eco-primary w-100">Log Masuk</button>
    </form>

    <div class="text-center mt-3">
      <small>Belum ada akaun? <a href="signup.html">Daftar</a></small>
    </div>

  </div>
</main>

<script src="app.js"></script>
</body>
</html>
