<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>EcoRecycle – Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="app-body">

<video autoplay muted loop playsinline id="bgVideo">
  <source src="eco-bg.mp4" type="video/mp4">
</video>

<header class="eco-header">
  <div class="container d-flex align-items-center gap-2 py-2">
    <div class="eco-logo-circle">♻️</div>
    <div>
      <div class="eco-title">EcoRecycle</div>
      <div class="eco-subtitle">Pickup Kitar Semula Komuniti</div>
    </div>
  </div>
</header>

<main class="auth-main">
  <div class="auth-card">

    <h2 class="auth-title">Log Masuk</h2>

    <div class="d-flex justify-content-center gap-2 mb-3">
      <button class="btn btn-eco-primary btn-sm" id="loginCustomer">Customer</button>
      <button class="btn btn-eco-outline btn-sm" id="loginRider">Rider</button>
    </div>

    <form id="loginForm">
      <input type="hidden" id="loginRole" value="customer">

      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" id="username" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">No Telefon</label>
        <input type="text" id="phone" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Kata Laluan</label>
        <input type="password" id="password" class="form-control" required>
      </div>

      <button class="btn btn-eco-primary w-100">Log Masuk</button>
    </form>

    <div class="text-center mt-3 small">
      <a href="#" id="forgotPassword">Lupa Kata Laluan?</a><br>
      Belum ada akaun? <a href="signup.html"><strong>Daftar</strong></a>
    </div>

  </div>
</main>

<script src="app.js"></script>
</body>
</html>
